spring.application.name=website
spring.datasource.url=jdbc:postgresql://localhost:5432/eib-website
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:12345}
spring.thymeleaf.cache=false
server.port=8080
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:schema.sql,classpath:data.sql